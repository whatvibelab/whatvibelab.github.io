  .archive-card-date {
    flex-shrink: 0;
    align-self: flex-start;
    font-size: 11px;
    color: var(--text-sub);
  }

  .archive-empty {
    padding: 32px 20px;
    text-align: center;
    border-radius: var(--radius-lg);
    background: var(--card-bg);
    border: 1px dashed var(--border);
    color: var(--text-sub);
    font-size: 14px;
    line-height: 1.7;
  }
  .archive-empty a { font-weight: 700; }

  .archive-actions { display: flex; gap: 10px; }
  .archive-actions .btn { flex: 1; }

  @media (min-width: 768px) {
    .archive-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
